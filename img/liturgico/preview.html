<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fondos litúrgicos — revisión semana a semana</title>
<!--
  ────────────────────────────────────────────────────────────────────────────
    Coro Pacem Deus — Parroquia Sagrada Familia
  ────────────────────────────────────────────────────────────────────────────

    @file    img/liturgico/preview.html
    @brief   Revisión de los fondos litúrgicos, navegando domingo a domingo
    @version v3.6.7r33

    Por qué existe: mirar los .webp sueltos en el explorador no dice nada. Lo
    que importa es cómo queda el fondo CON LA TARJETA ENCIMA, que es donde se
    decide si el texto se lee. Esta página los compone igual que la portada.

    El calendario no se duplica: se carga el módulo 21 del propio cancionero y
    se lee window.LITURGICAL_DATA. Así esta página nunca puede desincronizarse.

    Funciona abriéndola desde un servidor local (python -m http.server) o desde
    el sitio publicado. Con file:// el navegador bloquea la carga del módulo.

    El selector "Origen" permite mirar las imágenes de una rama de Pull Request
    sin hacer checkout: se piden a raw.githubusercontent. Las ramas fondos/* se
    descubren solas por la API de GitHub.
  ────────────────────────────────────────────────────────────────────────────
-->
<style>
  :root{
    --crema:#E8E0C8; --oro:#C8943C; --verde:#8BAF78;
    --panel:#141810; --borde:rgba(200,148,60,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0B0E08;color:var(--crema);
       font-family:'Cormorant Garamond',Georgia,serif}
  header{padding:14px 20px;border-bottom:1px solid var(--borde);
         display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         background:var(--panel);position:sticky;top:0;z-index:10}
  h1{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.18em;
     text-transform:uppercase;color:var(--verde);margin:0;font-weight:600}
  .nav{display:flex;align-items:center;gap:8px;margin-left:auto}
  button{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.12em;
         text-transform:uppercase;color:var(--crema);background:rgba(200,148,60,.1);
         border:1px solid var(--borde);border-radius:3px;padding:.5rem .9rem;
         cursor:pointer;transition:all .15s}
  button:hover:not(:disabled){background:rgba(200,148,60,.25);color:#FFE4A0}
  button:disabled{opacity:.3;cursor:default}
  .contador{font-size:.75rem;color:#7d8a70;min-width:5.5rem;text-align:center}
  .origen{display:flex;align-items:center;gap:6px}
  .origen span{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.12em;
               text-transform:uppercase;color:var(--verde)}
  select{background:var(--panel);color:var(--crema);border:1px solid var(--borde);
         border-radius:3px;padding:.45rem .6rem;font-family:inherit;font-size:.8rem}

  .ficha{padding:12px 20px;display:flex;gap:22px;flex-wrap:wrap;
         align-items:baseline;border-bottom:1px solid rgba(200,148,60,.14)}
  .ficha b{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.12em;
           text-transform:uppercase;color:var(--verde);font-weight:600}
  .ficha span{font-size:.95rem}
  .falta{color:#C87050}
  .cat{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.1em;
       text-transform:uppercase;padding:.2rem .5rem;border-radius:2px;
       border:1px solid var(--borde);color:var(--oro)}

  .lienzos{display:flex;gap:22px;padding:20px;align-items:flex-start;flex-wrap:wrap}
  .caja{position:relative;overflow:hidden;border:1px solid var(--borde);
        border-radius:6px;background:#0B0709;flex:0 0 auto}
  .caja.desktop{width:min(680px,100%);aspect-ratio:16/9}
  .caja.mobile{width:230px;aspect-ratio:9/20}
  .caja .rot{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.12em;
             text-transform:uppercase;color:#7d8a70;position:absolute;
             top:6px;left:8px;z-index:4}
  .bg{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
  .caja.desktop .bg{background-position:center 28%}
  .caja.mobile  .bg{background-position:center top}
  /* Mismo velo que el sitio, con el tinte del color litúrgico de la semana. */
  .velo{position:absolute;inset:0;pointer-events:none}
  .sinimagen{position:absolute;inset:0;display:flex;align-items:center;
             justify-content:center;color:#6c5a3a;font-size:.85rem;text-align:center;
             padding:1rem}

  /* Réplica reducida de la lit-card, para juzgar el contraste en contexto. */
  .tarjeta{position:absolute;left:50%;transform:translateX(-50%);
           background:rgba(200,148,60,.08);border:1px solid rgba(200,148,60,.3);
           border-radius:6px;padding:.7rem 1.1rem;text-align:center;z-index:3;
           width:min(62%,330px)}
  .caja.desktop .tarjeta{bottom:14%}
  .caja.mobile  .tarjeta{top:44%}
  .t1{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.14em;
      text-transform:uppercase;color:var(--oro);margin-bottom:.25rem}
  .t2{font-family:'Cinzel',serif;font-size:.72rem;color:#E8DCC0;line-height:1.3}
  .t3{font-style:italic;font-size:.72rem;color:#D4C8A0;margin-top:.4rem}

  footer{padding:14px 20px;color:#6c7a60;font-size:.8rem;border-top:1px solid rgba(200,148,60,.14)}
  kbd{font-family:ui-monospace,monospace;font-size:.72rem;border:1px solid var(--borde);
      border-radius:3px;padding:.1rem .35rem;color:var(--crema)}
  /* ── Progreso del lote (v3.6.7r32) ─────────────────────────────────────
     Se alimenta de progreso.json, que el generador reescribe entero después
     de cada imagen (con reemplazo atómico, para que nunca se lea a medias).
     Sondear un archivo estático es lo más simple que funciona aquí: no hay
     servidor con estado que pueda empujar eventos. */
  .progreso{margin:14px 20px 0;padding:12px 15px;border:1px solid var(--borde);
            border-radius:8px;background:var(--panel)}
  .prog-fila{display:flex;align-items:baseline;justify-content:space-between;
             gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .prog-tit{font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.14em;
            text-transform:uppercase;color:var(--oro)}
  .prog-det{font-size:.8rem;color:#9aa88c;text-align:right}
  .prog-riel{height:7px;border-radius:99px;background:rgba(255,255,255,.07);
             overflow:clip}
  .prog-relleno{height:100%;width:0;border-radius:99px;
                background:linear-gradient(90deg,#6B9E4A,#C8943C);
                transition:width .6s ease}
  .progreso.fin .prog-tit{color:#6B9E4A}
  .progreso.fin .prog-relleno{background:#6B9E4A}
  .aviso{margin:14px 20px 0;padding:11px 15px;border-radius:8px;font-size:.85rem;
         border:1px solid rgba(200,112,80,.5);background:rgba(200,112,80,.12);
         color:#E8B49C}
</style>
</head>
<body>

<header>
  <h1>Fondos litúrgicos · revisión</h1>
  <select id="salto"></select>
  <label class="origen">
    <span>Origen</span>
    <select id="origen">
      <option value="">Carpeta local</option>
    </select>
  </label>
  <div class="nav">
    <button id="prev">◀ Anterior</button>
    <span class="contador" id="contador">—</span>
    <button id="next">Siguiente ▶</button>
  </div>
</header>

<div class="aviso" id="aviso-origen" hidden></div>

<!-- Progreso del lote (v3.6.7r32). Sólo aparece si hay un progreso.json:
     cuando no se está generando nada, esta franja no existe. -->
<div class="progreso" id="progreso" hidden>
  <div class="prog-fila">
    <span class="prog-tit" id="prog-tit">Generando</span>
    <span class="prog-det" id="prog-det"></span>
  </div>
  <div class="prog-riel"><div class="prog-relleno" id="prog-relleno"></div></div>
</div>

<div class="ficha" id="ficha"></div>
<div class="lienzos">
  <div class="caja desktop">
    <span class="rot">Apaisada · 16:9</span>
    <div class="bg" id="bg-d"></div>
    <div class="velo" id="velo-d"></div>
    <div class="tarjeta" id="card-d"></div>
    <div class="sinimagen" id="falta-d" hidden></div>
  </div>
  <div class="caja mobile">
    <span class="rot">Vertical · 9:20</span>
    <div class="bg" id="bg-m"></div>
    <div class="velo" id="velo-m"></div>
    <div class="tarjeta" id="card-m"></div>
    <div class="sinimagen" id="falta-m" hidden></div>
  </div>
</div>
<footer>
  Navega con <kbd>←</kbd> <kbd>→</kbd>. La tarjeta y el velo son los del sitio real:
  si el texto se lee aquí, se lee en producción.
</footer>

<!-- El calendario sale del propio cancionero. Cero duplicación. -->
<script src="../../js/modules/21-liturgical-card.js"></script>
<script>
(function () {
  'use strict';

  var TINTES = {
    Verde:  '14,26,12',  Morado: '20,12,30', Blanco: '26,20,8',
    Rojo:   '26,8,8',    Rosa:   '28,16,20'
  };

  function velo(color) {
    var t = TINTES[color] || TINTES.Verde;
    return 'linear-gradient(180deg,' +
      'rgba(' + t + ',.72) 0%,rgba(' + t + ',.42) 28%,rgba(' + t + ',.38) 52%,' +
      'rgba(' + t + ',.74) 86%,rgba(' + t + ',.93) 100%)';
  }

  var D = window.LITURGICAL_DATA;
  if (!D) {
    document.getElementById('ficha').innerHTML =
      '<span class="falta">No se pudo leer el calendario. Abre esta página desde un ' +
      'servidor local (<code>python -m http.server</code>), no con file://</span>';
    return;
  }

  var claves = Object.keys(D).sort();

  /* Arranca en el domingo de hoy o el próximo, que es lo que se está revisando. */
  function proximoDomingo() {
    var d = new Date(); d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  var i = Math.max(0, claves.indexOf(proximoDomingo()));

  var sel = document.getElementById('salto');
  claves.forEach(function (k, n) {
    var o = document.createElement('option');
    o.value = n;
    o.textContent = k + '  ·  ' + D[k].n;
    sel.appendChild(o);
  });

  /* De donde salen los .webp.
     Las imagenes de un Pull Request viven en SU rama, no en main, asi que
     mirando solo la carpeta local el lote entero seria invisible justo cuando
     toca revisarlo. Con una rama seleccionada se piden a raw.githubusercontent,
     que sirve cualquier rama sin necesidad de hacer checkout. */
  var REPO = 'CoroPacemDeusPSF/ParroquiaSagradaFamilia';

  function baseImagenes() {
    var rama = document.getElementById('origen').value;
    return rama
      ? 'https://raw.githubusercontent.com/' + REPO + '/' + rama + '/img/liturgico/'
      : '';
  }

  /* Las ramas de fondos se descubren solas: no hay que teclear nombres. */
  function cargaRamas() {
    var sel = document.getElementById('origen');
    fetch('https://api.github.com/repos/' + REPO + '/branches?per_page=100')
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (ramas) {
        ramas.filter(function (b) { return b.name.indexOf('fondos/') === 0; })
             .forEach(function (b) {
               var o = document.createElement('option');
               o.value = b.name;
               o.textContent = b.name.replace('fondos/', '');
               sel.appendChild(o);
             });
        /* v3.6.7r33: el origen elegido YA NO se recuerda entre sesiones.
           Restaurarlo en silencio costó una confusión real: una rama elegida
           en otra sesión seguía activa al reabrir la página, de modo que se
           veían las ilustraciones VIEJAS de esa rama mientras en disco ya
           estaban las nuevas — y encima se acababan antes de tiempo, porque
           esa rama sólo cubría 16 domingos.
           Desde que la generación es local, la carpeta local es la verdad.
           Mirar una rama es la excepción y hay que pedirlo a propósito. */
      })
      .catch(function () { /* sin red: se queda en carpeta local */ });
  }

  /* Y si se elige una rama, que se note: un aviso fijo mientras dure. */
  function avisaOrigen() {
    var rama = document.getElementById('origen').value;
    var caja = document.getElementById('aviso-origen');
    caja.hidden = !rama;
    if (rama) {
      caja.textContent = 'Estás viendo la rama «' + rama + '» de GitHub, no tu ' +
        'carpeta local. Puede tener ilustraciones antiguas o cubrir menos ' +
        'domingos. Vuelve a «Carpeta local» para ver lo que hay en tu disco.';
    }
  }

  function ponImagen(caja, url, elBg, elFalta) {
    var probe = new Image();
    probe.onload = function () {
      elBg.style.backgroundImage = 'url("' + probe.src + '")';
      elFalta.hidden = true;
    };
    probe.onerror = function () {
      elBg.style.backgroundImage = 'none';
      elFalta.hidden = false;
      elFalta.textContent = 'Sin ilustración para esta semana.\nLa portada usaría el degradado del color litúrgico.';
    };
    probe.src = url;
  }

  function pinta() {
    var k = claves[i], v = D[k];

    sel.value = i;
    document.getElementById('contador').textContent = (i + 1) + ' / ' + claves.length;
    document.getElementById('prev').disabled = (i === 0);
    document.getElementById('next').disabled = (i === claves.length - 1);

    document.getElementById('ficha').innerHTML =
      '<span><b>Domingo</b> ' + k + '</span>' +
      '<span><b>Celebración</b> ' + v.n + '</span>' +
      (v.e ? '<span><b>Especial</b> ' + v.e + '</span>' : '') +
      '<span><b>Evangelio</b> ' + (v.ev || '—') + '</span>' +
      (MOTIVOS[k] ? '<span><b>Motivo</b> ' + MOTIVOS[k].es + '</span>' : '') +
      '<span class="cat">' + (v.c || 'Verde') + ' · ' + v.t + ' · ciclo ' + (v.ci || '—') + '</span>';

    var g = velo(v.c);
    document.getElementById('velo-d').style.background = g;
    document.getElementById('velo-m').style.background = g;

    var tarjeta =
      '<div class="t1">' + v.t + ' · Ciclo ' + (v.ci || '—') + '</div>' +
      '<div class="t2">' + v.n + '</div>' +
      (v.e ? '<div class="t1" style="margin-top:.2rem">' + v.e + '</div>' : '') +
      '<div class="t3">«' + (v.tema || '') + '»</div>';
    document.getElementById('card-d').innerHTML = tarjeta;
    document.getElementById('card-m').innerHTML = tarjeta;

    /* El sufijo cambia cada vez que el lote termina una imagen. Sin él, al
       repintar durante la generación el navegador serviría de su caché la
       versión anterior del mismo nombre de archivo y no se vería nada nuevo.
       Fuera de una generación queda vacío y la caché funciona normal. */
    var base = baseImagenes();
    ponImagen('desktop', base + k + '-desktop.webp' + rompeCache,
              document.getElementById('bg-d'), document.getElementById('falta-d'));
    ponImagen('mobile', base + k + '-mobile.webp' + rompeCache,
              document.getElementById('bg-m'), document.getElementById('falta-m'));
  }

  function mueve(paso) {
    i = Math.min(claves.length - 1, Math.max(0, i + paso));
    pinta();
  }

  document.getElementById('prev').addEventListener('click', function () { mueve(-1); });
  document.getElementById('next').addEventListener('click', function () { mueve(1); });
  sel.addEventListener('change', function () { i = +sel.value; pinta(); });
  document.getElementById('origen').addEventListener('change', function () {
    avisaOrigen();
    pinta();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { mueve(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { mueve(1);  e.preventDefault(); }
  });

  /* ── Motivo de cada domingo ────────────────────────────────────────────
     Se lee de motivos.json para poder revisar de un vistazo QUÉ objeto le
     tocó a cada domingo, que es justo donde estaban las repeticiones. Si el
     archivo no está, la ficha simplemente no muestra esa línea. */
  var rompeCache = '';
  var MOTIVOS = {};
  fetch('motivos.json')
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (m) { MOTIVOS = m; pinta(); })
    .catch(function () {});

  /* ── Seguimiento del lote ──────────────────────────────────────────────
     Sondea progreso.json cada 3 s. Cuando termina, deja de sondear: no tiene
     sentido seguir pidiendo un archivo que ya no cambia.

     Además repinta la semana en curso al vuelo, así se ve aparecer cada
     ilustración según se genera sin tocar nada. El ?t= es obligatorio: sin
     él el navegador serviría la imagen vieja de su caché. */
  (function seguimiento() {
    var caja = document.getElementById('progreso');
    var visto = -1;

    function tic() {
      fetch('progreso.json?t=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (p) {
          if (!p) { caja.hidden = true; return; }
          caja.hidden = false;

          var hechas = p.hechas + (p.fallos ? p.fallos.length : 0);
          var pct = p.total ? Math.round(hechas * 100 / p.total) : 0;
          document.getElementById('prog-relleno').style.width = pct + '%';

          if (p.terminado) {
            caja.classList.add('fin');
            document.getElementById('prog-tit').textContent = 'Lote terminado';
            document.getElementById('prog-det').textContent =
              p.hechas + ' ilustraciones en ' + p.duracion_min + ' min' +
              (p.fallos && p.fallos.length ? '  ·  ' + p.fallos.length + ' con fallo' : '');
            return;   // se corta el sondeo
          }

          document.getElementById('prog-tit').textContent =
            'Generando · motor ' + p.motor;
          var enc = p.en_curso;
          document.getElementById('prog-det').textContent =
            hechas + ' de ' + p.total + '  (' + pct + '%)' +
            (enc ? '  ·  ahora ' + enc.clave + ' ' + enc.variante : '') +
            (p.faltan_min != null ? '  ·  quedan ~' + p.faltan_min + ' min' : '');

          /* Si acaba de terminar una imagen del domingo que está en pantalla,
             se repinta para verla aparecer. */
          /* El sufijo cambia con cada imagen terminada. En la PRIMERA lectura
             se repinta siempre: al abrir la página, el navegador ya tiene en
             caché las versiones anteriores de esos mismos nombres de archivo
             y sin esto seguiría enseñándolas. */
          if (p.hechas !== visto) {
            var primera = (visto === -1);
            visto = p.hechas;
            rompeCache = '?n=' + p.hechas;
            var ult = p.hechas_lista && p.hechas_lista[p.hechas_lista.length - 1];
            if (primera || (ult && ult.clave === claves[i])) pinta();
          }
          setTimeout(tic, 3000);
        })
        .catch(function () { caja.hidden = true; });
    }
    tic();
  })();

  pinta();
  cargaRamas();
})();
</script>
</body>
</html>
