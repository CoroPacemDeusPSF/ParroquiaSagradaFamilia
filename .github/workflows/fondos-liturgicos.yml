# ────────────────────────────────────────────────────────────────────────────
#  Coro Pacem Deus — Parroquia Sagrada Familia
# ────────────────────────────────────────────────────────────────────────────
#
#   Genera las ilustraciones de portada y abre un Pull Request para aprobarlas.
#
#   DOS MODOS
#     • Semanal (automático, lunes): el próximo domingo.
#     • Lote (manual, con `hasta`): todos los domingos que falten hasta esa
#       fecha, en un solo PR. Los evangelios están fijados de antemano, así que
#       no hay razón para esperar a que llegue cada semana.
#
#   POR QUÉ UN PR Y NO UN COMMIT DIRECTO
#   Una imagen generada puede salir con iconografía equivocada, con una mano de
#   seis dedos o sencillamente fea, y esto es la portada de una parroquia. El PR
#   es el punto donde una persona mira antes de publicar. Fusionarlo dispara el
#   redespliegue de GitHub Pages; si no se fusiona, la portada se queda con el
#   degradado del color litúrgico, que es un estado digno.
#
#   REQUISITOS
#     • Secreto  OPENAI_API_KEY
#     • Variable IMAGE_MODEL — opcional, por defecto gpt-image-1
#     • Settings → Actions → General → "Allow GitHub Actions to create and
#       approve pull requests" activado
#
#   COSTE
#     Unos 0,04 USD por imagen, dos por domingo.
# ────────────────────────────────────────────────────────────────────────────

name: Fondos litúrgicos semanales

on:
  schedule:
    # Lunes 11:00 UTC = 06:00 en Lima. Deja toda la semana para revisar el PR.
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      sunday:
        description: 'Domingo concreto (AAAA-MM-DD). Vacío = el próximo.'
        required: false
        type: string
      hasta:
        description: 'LOTE: generar hasta esta fecha (AAAA-MM-DD). Vacío = solo un domingo.'
        required: false
        type: string
      dry_run:
        description: 'Solo mostrar los prompts, sin generar ni gastar crédito'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fondos-liturgicos
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # un lote largo puede tardar; el semanal, 2 minutos

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install --quiet --upgrade Pillow

      - name: Leer el calendario litúrgico
        id: semana
        run: |
          set -euo pipefail
          node scripts/liturgical-week.js --check

          DESDE="${{ inputs.sunday }}"
          HASTA="${{ inputs.hasta }}"

          if [ -n "$HASTA" ]; then
            # Sin fecha de inicio, el lote arranca en el próximo domingo.
            if [ -z "$DESDE" ]; then
              DESDE=$(node scripts/liturgical-week.js | jq -r .sunday_key)
            fi
            node scripts/liturgical-week.js --range "$DESDE" "$HASTA" > semanas.json
            N=$(jq 'length' semanas.json)
            PRIMERO=$(jq -r '.[0].sunday_key' semanas.json)
            ULTIMO=$(jq -r '.[-1].sunday_key' semanas.json)
            {
              echo "modo=lote"
              echo "n=$N"
              echo "primero=$PRIMERO"
              echo "ultimo=$ULTIMO"
              echo "rama=fondos/lote-$PRIMERO-a-$ULTIMO"
              echo "titulo=Fondos litúrgicos: $N domingos, de $PRIMERO a $ULTIMO"
            } >> "$GITHUB_OUTPUT"
            echo "LOTE de $N domingos: $PRIMERO -> $ULTIMO"
            jq -r '.[] | "  \(.sunday_key)  \(.liturgical_context)"' semanas.json
          else
            node scripts/liturgical-week.js $DESDE > semanas.json
            S=$(jq -r .sunday_key semanas.json)
            C=$(jq -r .liturgical_context semanas.json)
            {
              echo "modo=simple"
              echo "n=1"
              echo "primero=$S"
              echo "ultimo=$S"
              echo "rama=fondos/$S"
              echo "titulo=Fondos litúrgicos $S — $C"
            } >> "$GITHUB_OUTPUT"
            cat semanas.json
          fi

      - name: Mostrar los prompts (sin gastar crédito)
        if: inputs.dry_run
        run: python scripts/generate-backgrounds.py --week semanas.json --print-prompts

      # En lote, el propio guion se salta los domingos que ya tienen imagen, así
      # que no hace falta comprobarlo aquí. En modo simple sí, para no gastar
      # crédito regenerando algo que ya está en main.
      - name: ¿Ya existe la ilustración?
        id: existentes
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${{ steps.semana.outputs.modo }}" = "simple" ]; then
            S="${{ steps.semana.outputs.primero }}"
            if [ -f "img/liturgico/$S-desktop.webp" ] && [ -f "img/liturgico/$S-mobile.webp" ]; then
              echo "hay=si" >> "$GITHUB_OUTPUT"
              echo "Las dos ilustraciones de $S ya están en el repositorio. No se genera nada."
              exit 0
            fi
          fi
          echo "hay=no" >> "$GITHUB_OUTPUT"

      - name: Generar las ilustraciones
        id: generar
        if: ${{ !inputs.dry_run && steps.existentes.outputs.hay == 'no' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # El `||` da el valor por defecto cuando la variable no está definida:
          # sin él, GitHub inyecta una cadena vacía y la API rechaza el modelo.
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gpt-image-1' }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::Falta el secreto OPENAI_API_KEY en la configuración del repositorio."
            exit 1
          fi
          python scripts/generate-backgrounds.py --week semanas.json

      - name: Abrir el Pull Request
        if: ${{ !inputs.dry_run && steps.existentes.outputs.hay == 'no' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${{ steps.semana.outputs.rama }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add img/liturgico/*.webp

          if git diff --cached --quiet; then
            echo "No hay imágenes nuevas que subir."
            exit 0
          fi

          git commit -m "${{ steps.semana.outputs.titulo }}"
          git push --force origin "$BRANCH"

          LISTA=$(jq -r '(if type=="array" then . else [.] end)[] | "| `\(.sunday_key)` | \(.liturgical_context) | \(.gospel) — «\(.gospel_theme)» | \(.liturgical_color) |"' semanas.json)

          BODY=$(cat <<EOF
          ## ${{ steps.semana.outputs.titulo }}

          | Domingo | Celebración | Evangelio | Color |
          |---|---|---|---|
          $LISTA

          **Control automático:** ${{ steps.generar.outputs.warnings || 'sin avisos' }}

          > El control solo comprueba que **no haya una zona clara donde va el texto**, que es
          > lo único que mide con fiabilidad. No juzga si la imagen es buena: eso se mira.

          ### Antes de fusionar, mirar de verdad las imágenes

          - Iconografía correcta y propia del sujeto, sin atributos prestados de otro.
          - Rostro y manos con anatomía natural; contar los dedos.
          - **Sin rostros duplicados ni figuras de relleno al fondo.**
          - En los domingos simbólicos, **ninguna figura humana** debe aparecer.
          - Ninguna zona clara detrás de donde va la tarjeta litúrgica.
          - Sin texto, logos ni firmas generados dentro de la imagen.
          - Apaisada y vertical deben parecer de la misma familia artística.

          Los criterios completos están en \`img/liturgico/PRESET.md\`.
          Para verlas en contexto, con la tarjeta encima: \`img/liturgico/preview.html\`.

          Al fusionar, GitHub Pages redespliega solo. Si no se fusiona, la portada se queda
          con el degradado del color litúrgico de la semana, que es un estado válido.

          ---
          Generado automáticamente por \`.github/workflows/fondos-liturgicos.yml\`.
          EOF
          )

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --title "${{ steps.semana.outputs.titulo }}" \
              --body "$BODY" \
              --base main \
              --head "$BRANCH"
          else
            echo "Ya había un PR abierto para $BRANCH; se actualizó la rama."
          fi
